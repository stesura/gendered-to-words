name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run lint
      - run: npm run checktypes
      - run: npx vitest run
      - run: npm run build

      - name: Validate packaging
        run: |
          npx --yes publint
          # See ci.yml: package.json is exported on purpose and attw's node10
          # lane cannot type a JSON file.
          npx --yes @arethetypeswrong/cli --pack . --exclude-entrypoints package.json

      - name: Publish to npm
        run: npm publish --access public
